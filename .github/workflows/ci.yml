name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build app
        run: dotnet build TaskFirst.csproj -c Release --nologo
      - name: Build license tool
        run: dotnet build tools/LicenseTool/LicenseTool.csproj -c Release --nologo
